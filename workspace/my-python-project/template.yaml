AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: my-python-project - Automated deployment

Globals:
  Function:
    Runtime: python3.9
    Timeout: 30
    MemorySize: 512

Resources:
  MainFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: my-python-project-function
      CodeUri: ./
      Handler: main.lambda_handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /
            Method: ANY

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
